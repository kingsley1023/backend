services:
  ppanel:
    container_name: ppanel-server
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ppanel-postgres:
        condition: service_healthy
      ppanel-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./etc/ppanel.yaml:/app/etc/ppanel.yaml
    environment:
      PPANEL_DB: ${PPANEL_DB}
      PPANEL_REDIS: ${PPANEL_REDIS}
    networks:
      - ppanel-internal
    restart: unless-stopped

  ppanel-postgres:
    image: postgres:18-alpine
    container_name: ppanel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ppanel}
      POSTGRES_USER: ${POSTGRES_USER:-ppanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ppanel_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ppanel-internal
    restart: unless-stopped

  ppanel-redis:
    image: redis:8-alpine
    container_name: ppanel-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ppanel_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ppanel-internal
    restart: unless-stopped

volumes:
  ppanel_postgres_data:
  ppanel_redis_data:

networks:
  ppanel-internal:
    name: ppanel-internal
    driver: bridge
